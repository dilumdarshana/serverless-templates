# pnpm workspace settings (pnpm >= 10 reads settings from this file).
# Explicitly allow packages that ship native binaries / postinstall scripts.
allowBuilds:
  esbuild: true
  serverless: true
  unrs-resolver: true

# pnpm 11 blocks packages published less than 24h ago. The freshly published
# @aws-sdk releases are pinned via minimumReleaseAgeExclude so they install.
minimumReleaseAgeExclude:
  - '@aws-sdk/client-cognito-identity-provider@3.1104.0'
  - '@aws-sdk/client-dynamodb@3.1104.0'
  - '@aws-sdk/client-s3@3.1104.0'
  - '@aws-sdk/client-sqs@3.1104.0'
  - '@aws-sdk/lib-dynamodb@3.1104.0'
  - '@aws-sdk/s3-request-presigner@3.1104.0'

# Force patched versions of vulnerable transitive dev-deps (jest/serverless chains).
overrides:
  'minimatch@<3.1.3': 3.1.4
  'picomatch@<2.3.2': 2.3.2
  'brace-expansion@<1.1.18': 1.1.18
  'js-yaml@<3.15.0': 3.15.0
  'undici@<6.28.0': 6.28.0
